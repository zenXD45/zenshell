<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZenShell AGS — Islands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1536px; height:864px; overflow:hidden; }
  body {
    font-family:"Fira Sans",system-ui,sans-serif; color:#d3c6aa;
    background:
      radial-gradient(1150px 700px at 50% 34%, rgba(29,185,84,.22), transparent 60%),
      radial-gradient(760px 520px at 14% 86%, rgba(127,187,179,.13), transparent 60%),
      linear-gradient(168deg,#0f1715 0%,#101c18 46%,#0a1210 100%);
    position:relative;
  }
  .haze { position:absolute; inset:0; background:radial-gradient(1200px 700px at 50% 40%,rgba(15,23,21,.30),rgba(15,23,21,.78)); }

  .pane {
    position:absolute; background:rgba(24,34,31,.90);
    border:1px solid rgba(29,185,84,.22);
    box-shadow:0 24px 56px rgba(0,0,0,.60), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(24px) saturate(1.15);
  }
  .lbl { font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:#9da9a0; }

  /* ── Top island: the clock lives alone in its own capsule ── */
  .island-top {
    top:22px; left:50%; transform:translateX(-50%);
    height:44px; padding:0 20px; border-radius:22px;
    display:flex; align-items:center; gap:14px;
  }
  .island-top .t { font-size:16px; font-weight:600; font-family:"JetBrains Mono",monospace; letter-spacing:.02em; }
  .island-top .d { font-size:10px; color:#9da9a0; letter-spacing:.10em; text-transform:uppercase; }
  .island-top .sep { width:1px; height:16px; background:rgba(211,198,170,.14); }
  .island-top .ic { display:flex; align-items:center; gap:6px; font-size:11px; color:#9da9a0; font-family:"JetBrains Mono",monospace; }
  .island-top .ic svg { width:14px; height:14px; stroke:#9da9a0; fill:none; stroke-width:1.7; }
  .island-top .ic.ok svg { stroke:#1db954; }

  /* ── Now-playing island, directly beneath the clock ── */
  .island-now {
    top:74px; left:50%; transform:translateX(-50%);
    width:420px; padding:11px 16px; border-radius:18px;
    display:flex; align-items:center; gap:13px;
  }
  .cover { width:38px; height:38px; border-radius:10px; flex:none;
    background:linear-gradient(140deg,#1db954,#7fbbb3 62%,#0f1715);
    box-shadow:0 4px 14px rgba(29,185,84,.28); }
  .np .ttl { font-size:12px; font-weight:600; color:#d3c6aa; margin-bottom:2px; }
  .np .art { font-size:11px; color:#9da9a0; }
  .np .bar2 { margin-top:7px; height:3px; border-radius:2px; background:rgba(211,198,170,.14); position:relative; }
  .np .bar2 i { position:absolute; inset:0 38% 0 0; border-radius:2px; background:#1db954; }
  .np .rt { margin-left:auto; display:flex; gap:7px; }
  .np .rt svg { width:15px; height:15px; stroke:#9da9a0; fill:none; stroke-width:1.7; }

  /* ── Left island: workspace strip ── */
  .island-left {
    left:22px; top:50%; transform:translateY(-50%);
    width:62px; padding:12px 0; border-radius:20px;
    display:flex; flex-direction:column; align-items:center; gap:9px;
  }
  .ws { width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    font-size:11px; font-family:"JetBrains Mono",monospace; color:#9da9a0;
    background:rgba(211,198,170,.06); border:1px solid rgba(211,198,170,.07); }
  .ws.on { background:rgba(29,185,84,.20); border-color:rgba(29,185,84,.38); color:#d3c6aa; }
  .ws.busy::after { content:""; position:absolute; margin:26px 0 0 26px; width:5px; height:5px;
    border-radius:50%; background:#dbbc7f; }

  /* ── Right island: status stack ── */
  .island-right {
    right:22px; top:50%; transform:translateY(-50%);
    width:224px; padding:14px 15px; border-radius:20px;
  }
  .strow { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .strow + .strow { border-top:1px solid rgba(211,198,170,.08); }
  .strow svg { width:15px; height:15px; stroke:#9da9a0; fill:none; stroke-width:1.7; flex:none; }
  .strow .tx { font-size:12px; color:#d3c6aa; }
  .strow .sub { font-size:10px; color:#9da9a0; margin-top:1px; }
  .strow .val { margin-left:auto; font-size:11px; color:#9da9a0; font-family:"JetBrains Mono",monospace; }
  .strow.ok svg { stroke:#1db954; }
  .strow.warn svg { stroke:#e67e80; }

  /* ── Launcher: the one surface that takes the whole stage ── */
  .stage {
    left:50%; bottom:96px; transform:translateX(-50%);
    width:600px; padding:8px 0; border-radius:22px;
  }
  .search { height:50px; display:flex; align-items:center; gap:13px; padding:0 20px; }
  .search svg { width:18px; height:18px; stroke:#9da9a0; fill:none; stroke-width:1.7; }
  .search .ph { font-size:15px; color:#9da9a0; }
  .search .kbd { margin-left:auto; font-size:10px; color:#9da9a0; font-family:"JetBrains Mono",monospace;
    padding:3px 8px; border-radius:6px; border:1px solid rgba(211,198,170,.14); }
  .divider { height:1px; background:rgba(211,198,170,.09); margin:2px 14px 8px; }
  .apps { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:0 12px 10px; }
  .appc { display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 4px; border-radius:14px; }
  .appc:hover { background:rgba(211,198,170,.06); }
  .appc .ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    background:rgba(211,198,170,.08); border:1px solid rgba(211,198,170,.08); }
  .appc .ic svg { width:19px; height:19px; stroke:#9da9a0; fill:none; stroke-width:1.6; }
  .appc.hit .ic { background:rgba(29,185,84,.20); border-color:rgba(29,185,84,.36); }
  .appc.hit .ic svg { stroke:#1db954; }
  .appc .nm { font-size:10px; color:#9da9a0; text-align:center; }
  .appc.hit .nm { color:#d3c6aa; }
</style>
</head>
<body>
  <div class="haze"></div>

  <!-- Top island: clock alone -->
  <div class="pane island-top">
    <span class="t">10:48</span>
    <span class="d">Thu 22 Oct</span>
    <span class="sep"></span>
    <span class="ic ok"><svg viewBox="0 0 24 24"><path d="M2 8a14 14 0 0118 0"/><path d="M5 12a9 9 0 0112 0"/><circle cx="12" cy="18" r="1.6"/></svg>BSNL0962</span>
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg>70</span>
  </div>

  <!-- Now-playing island -->
  <div class="pane island-now">
    <div class="cover"></div>
    <div class="np" style="flex:1">
      <div class="ttl">Midnight City</div>
      <div class="art">M83 — Hurry Up, We're Dreaming</div>
      <div class="bar2"><i></i></div>
    </div>
    <div class="rt">
      <svg viewBox="0 0 24 24"><path d="M6 5l12 7-12 7z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M18 6l-12 6 12 6z"/></svg>
    </div>
  </div>

  <!-- Left island: workspaces -->
  <div class="pane island-left">
    <div class="ws on">1</div>
    <div class="ws busy">2</div>
    <div class="ws">3</div>
    <div class="ws">4</div>
    <div class="ws">5</div>
  </div>

  <!-- Right island: status stack -->
  <div class="pane island-right">
    <p class="lbl" style="margin-bottom:4px">System</p>
    <div class="strow ok"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M21 11v2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="#1db954" stroke="none"/></svg><div><div class="tx">Battery</div><div class="sub">Charging</div></div><span class="val">78%</span></div>
    <div class="strow ok"><svg viewBox="0 0 24 24"><path d="M7 11l4 4 6-7"/></svg><div><div class="tx">Bluetooth</div><div class="sub">MX Keys</div></div><span class="val">on</span></div>
    <div class="strow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><div><div class="tx">Power</div><div class="sub">Balanced</div></div><span class="val">—</span></div>
  </div>

  <!-- Launcher takes the stage -->
  <div class="pane stage">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="ph">Search applications</span>
      <span class="kbd">SUPER</span>
    </div>
    <div class="divider"></div>
    <div class="apps">
      <div class="appc hit"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/></svg></div><span class="nm">kitty</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></div><span class="nm">Helium</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/></svg></div><span class="nm">Files</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></div><span class="nm">Apps</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 12h18M12 3v18"/></svg></div><span class="nm">Terminal</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></div><span class="nm">Settings</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg></div><span class="nm">Code</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div><span class="nm">Music</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14"/></svg></div><span class="nm">Power</span></div>
      <div class="appc"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></div><span class="nm">Screenshot</span></div>
    </div>
  </div>
</body>
</html>

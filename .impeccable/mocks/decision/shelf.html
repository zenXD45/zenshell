<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZenShell AGS — Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1536px; height:864px; overflow:hidden; }
  body {
    font-family:"Fira Sans",system-ui,sans-serif;
    color:#d3c6aa;
    background:
      radial-gradient(1200px 700px at 68% 18%, rgba(29,185,84,.20), transparent 62%),
      radial-gradient(900px 620px at 22% 78%, rgba(127,187,179,.14), transparent 60%),
      linear-gradient(168deg,#0f1715 0%,#101c18 46%,#0a1210 100%);
    position:relative;
  }
  .wall-haze { position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(15,23,21,.55),rgba(15,23,21,.86)); }
  .mono { font-family:"JetBrains Mono",monospace; }

  /* ── Shelf: one continuous horizontal instrument along the bottom edge ── */
  .shelf {
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    width:1180px; height:64px; display:flex; align-items:center; gap:18px;
    padding:0 20px; border-radius:20px;
    background:rgba(24,34,31,.88);
    border:1px solid rgba(29,185,84,.20);
    box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(22px) saturate(1.15);
  }
  .cluster { display:flex; align-items:center; gap:12px; }
  .spacer { flex:1; }
  .pips { display:flex; gap:6px; }
  .pip { width:8px; height:8px; border-radius:50%; background:rgba(157,169,160,.30); }
  .pip.on { background:#1db954; box-shadow:0 0 0 3px rgba(29,185,84,.18); }
  .pip.busy { background:rgba(211,198,170,.55); }
  .app { width:30px; height:30px; border-radius:9px; background:rgba(211,198,170,.10);
    border:1px solid rgba(211,198,170,.10); display:grid; place-items:center; }
  .app svg { width:16px; height:16px; stroke:#9da9a0; fill:none; stroke-width:1.6; }
  .app.run svg { stroke:#1db954; }
  .clock { text-align:center; line-height:1.05; }
  .clock .t { font-size:19px; font-weight:600; letter-spacing:.01em; color:#d3c6aa; }
  .clock .d { font-size:10px; color:#9da9a0; letter-spacing:.12em; text-transform:uppercase; }
  .stat { display:flex; align-items:center; gap:9px; padding:0 10px; height:34px;
    border-radius:11px; background:rgba(211,198,170,.07); border:1px solid rgba(211,198,170,.08); }
  .stat svg { width:15px; height:15px; stroke:#d3c6aa; fill:none; stroke-width:1.7; }
  .stat .v { font-size:12px; color:#d3c6aa; font-family:"JetBrains Mono",monospace; }
  .stat.low svg { stroke:#e67e80; }

  /* ── Quick settings: grows straight out of the shelf's right end ── */
  .qs {
    position:absolute; right:178px; bottom:104px; width:308px; padding:16px;
    border-radius:20px; background:rgba(24,34,31,.92);
    border:1px solid rgba(29,185,84,.24);
    box-shadow:0 22px 52px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(24px) saturate(1.15);
  }
  .qs h4 { font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase;
    color:#9da9a0; margin-bottom:11px; }
  .row { display:flex; align-items:center; gap:11px; margin-bottom:13px; }
  .row svg { width:15px; height:15px; stroke:#9da9a0; fill:none; stroke-width:1.7; flex:none; }
  .row .lab { font-size:12px; width:52px; color:#d3c6aa; }
  .track { flex:1; height:5px; border-radius:3px; background:rgba(211,198,170,.13); position:relative; }
  .fill { position:absolute; inset:0 auto 0 0; border-radius:3px; background:#1db954; }
  .fill.warm { background:#dbbc7f; }
  .pct { font-size:11px; color:#9da9a0; font-family:"JetBrains Mono",monospace; width:34px; text-align:right; }
  .toggles { display:flex; gap:8px; margin-top:14px; }
  .tg { flex:1; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px;
    background:rgba(211,198,170,.07); border:1px solid rgba(211,198,170,.08); }
  .tg svg { width:14px; height:14px; stroke:#9da9a0; fill:none; stroke-width:1.7; }
  .tg.on { background:rgba(29,185,84,.18); border-color:rgba(29,185,84,.34); }
  .tg.on svg { stroke:#1db954; }
  .tg span { font-size:10px; color:#9da9a0; }
  .tg.on span { color:#d3c6aa; }

  /* ── One notification card stacked on the shelf's right shoulder ── */
  .note {
    position:absolute; right:178px; bottom:186px; width:308px; padding:13px 15px;
    border-radius:18px; background:rgba(24,34,31,.92);
    border:1px solid rgba(29,185,84,.24);
    box-shadow:0 22px 52px rgba(0,0,0,.62);
    backdrop-filter:blur(24px) saturate(1.15);
  }
  .note .hd { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .note .dot { width:7px; height:7px; border-radius:50%; background:#1db954; }
  .note .app2 { font-size:11px; font-weight:600; color:#d3c6aa; }
  .note .when { margin-left:auto; font-size:10px; color:#9da9a0; font-family:"JetBrains Mono",monospace; }
  .note p { font-size:12px; color:#9da9a0; line-height:1.45; }

  /* ── Launcher: a search field that rises from the shelf's centre ── */
  .search {
    position:absolute; left:50%; bottom:104px; transform:translateX(-50%);
    width:520px; height:52px; display:flex; align-items:center; gap:12px; padding:0 18px;
    border-radius:17px; background:rgba(24,34,31,.92);
    border:1px solid rgba(29,185,84,.26);
    box-shadow:0 22px 52px rgba(0,0,0,.62);
    backdrop-filter:blur(24px) saturate(1.15);
  }
  .search svg { width:17px; height:17px; stroke:#9da9a0; fill:none; stroke-width:1.7; }
  .search .ph { font-size:14px; color:#9da9a0; }
  .search .kbd { margin-left:auto; font-size:10px; color:#9da9a0; font-family:"JetBrains Mono",monospace;
    padding:3px 7px; border-radius:6px; border:1px solid rgba(211,198,170,.14); }
  .caret { width:1.5px; height:17px; background:#1db954; }
</style>
</head>
<body>
  <div class="wall-haze"></div>

  <!-- Launcher search rises from the shelf's centre -->
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="ph">Search applications</span>
    <span class="caret"></span>
    <span class="kbd">SUPER</span>
  </div>

  <!-- Notification card on the shelf's right shoulder -->
  <div class="note">
    <div class="hd"><span class="dot"></span><span class="app2">Kitty</span><span class="when">now</span></div>
    <p>Build finished — ags compiled in 412 ms.</p>
  </div>

  <!-- Quick settings grows out of the shelf's right end -->
  <div class="qs">
    <h4>Quick settings</h4>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 010 6"/></svg>
      <span class="lab">Volume</span>
      <div class="track"><div class="fill" style="width:70%"></div></div>
      <span class="pct">70%</span>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      <span class="lab">Bright</span>
      <div class="track"><div class="fill warm" style="width:58%"></div></div>
      <span class="pct">58%</span>
    </div>
    <div class="row">
      <svg viewBox="0 0 24 24"><path d="M2 8a14 14 0 0118 0"/><path d="M5 12a9 9 0 0112 0"/><circle cx="12" cy="18" r="1.6"/></svg>
      <span class="lab">Wi-Fi</span>
      <div class="track"><div class="fill" style="width:100%"></div></div>
      <span class="pct">BSNL</span>
    </div>
    <div class="toggles">
      <div class="tg on"><svg viewBox="0 0 24 24"><path d="M7 11l4 4 6-7"/></svg><span>BT</span></div>
      <div class="tg"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/></svg><span>DND</span></div>
      <div class="tg"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg><span>Power</span></div>
    </div>
  </div>

  <!-- The shelf: one continuous instrument along the bottom edge -->
  <div class="shelf">
    <div class="cluster">
      <div class="pips">
        <span class="pip on"></span><span class="pip busy"></span><span class="pip"></span>
        <span class="pip"></span><span class="pip"></span>
      </div>
      <div class="app run"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/></svg></div>
      <div class="app run"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></div>
      <div class="app"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0118 0"/></svg></div>
    </div>
    <div class="spacer"></div>
    <div class="clock">
      <div class="t">10:48</div>
      <div class="d">Thu 22 Oct</div>
    </div>
    <div class="spacer"></div>
    <div class="cluster">
      <div class="stat"><svg viewBox="0 0 24 24"><path d="M2 8a14 14 0 0118 0"/><path d="M5 12a9 9 0 0112 0"/><circle cx="12" cy="18" r="1.6"/></svg><span class="v">BSNL</span></div>
      <div class="stat"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg><span class="v">70</span></div>
      <div class="stat"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M21 11v2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="#1db954" stroke="none"/></svg><span class="v">78</span></div>
    </div>
  </div>
</body>
</html>

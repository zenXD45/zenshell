<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  HyprZen — system typography.

  Google Sans Flex is the desktop's UI face. It ships as one variable font
  with a weight axis from 100 to 900, so every weight the interface asks for
  is the same file rather than a dozen separate ones, and the width axis
  lets the shell tighten or loosen a line without switching families.

  Only the proportional faces are remapped. Monospace is left alone on
  purpose: a terminal, a code editor and any column of figures need glyphs
  on a fixed advance, and a proportional face would silently break them.
-->
<fontconfig>

    <!-- The generic families every toolkit asks for first. -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Google Sans Flex</family>
        </prefer>
    </alias>

    <alias>
        <family>sans</family>
        <prefer>
            <family>Google Sans Flex</family>
        </prefer>
    </alias>

    <alias>
        <family>system-ui</family>
        <prefer>
            <family>Google Sans Flex</family>
        </prefer>
    </alias>

    <!-- The name Google Sans is usually asked for by. The static family is
         installed on this machine too, so this has to be an assignment
         rather than a preference for the flexible one to win. -->
    <match target="pattern">
        <test name="family"><string>Google Sans</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <!-- Faces that ship on a stock desktop and ask for by name. -->
    <match target="pattern">
        <test name="family"><string>Noto Sans</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Inter</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Ubuntu</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Roboto</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <!-- The remaining stock UI faces. An app that asks for one of these by
         name — GTK's own Adwaita Sans, Qt's fallback, a Chromium build that
         asks for Arial — should land on the same face rather than a different
         one per application. -->
    <match target="pattern">
        <test name="family"><string>Adwaita Sans</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>DejaVu Sans</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Liberation Sans</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Cantarell</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Helvetica</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family"><string>Arial</string></test>
        <edit name="family" mode="assign" binding="strong">
            <string>Google Sans Flex</string>
        </edit>
    </match>

</fontconfig>

# One Dark — restrained and familiar. Moderate rounding, hairline borders.

[meta]
name = "One Dark"
slug = "one-dark"
icon = "💻"
dark  = true

[colors]
bg      = "#282c34"
surface = "#21252b"
overlay = "#1b1d23"
accent  = "#61afef"
fg      = "#abb2bf"
subfg   = "#9da5b4"
urgent  = "#e06c75"

[geometry]
rounding = 8
border_size = 1
gaps_in = 4
gaps_out = 10
blur_size = 4
blur_passes = 2
inactive_opacity = 0.92
shadow_color = "rgba(00000066)"

[palette]
black   = "#1b1d23"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"
bright_black   = "#5c6370"
bright_red     = "#e06c75"
bright_green   = "#98c379"
bright_yellow  = "#e5c07b"
bright_blue    = "#61afef"
bright_magenta = "#c678dd"
bright_cyan    = "#56b6c2"
bright_white   = "#c8ccd4"

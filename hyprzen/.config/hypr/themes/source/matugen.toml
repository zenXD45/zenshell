# Matugen 4.x ↔ HyprZen bridge.
#
# Emits a complete HyprZen theme source (same schema as themes/source/*.toml)
# from Matugen's Material You roles + base16 scheme. gen-themes.py consumes the
# result, so the wallpaper palette reaches Hyprland, Kitty, GTK CSS and the
# island without any of them parsing Matugen's own output format.
[meta]
name = "Matugen"
slug = "matugen"
icon = "🎨"
dark  = true

[colors]
bg      = "#191113"
surface = "#191113"
overlay = "#22191b"
accent  = "#ffb1c0"
fg      = "#efdee0"
subfg   = "#d6c2c4"
urgent  = "#ffb4ab"

[geometry]
rounding = 14
border_size = 0
gaps_in = 5
gaps_out = 14
blur_size = 5
blur_passes = 3
inactive_opacity = 0.93
shadow_color = "rgba(0000008c)"

[palette]
black   = "#232223"
red     = "#b2b2b2"
green   = "#b2b2b2"
yellow  = "#b2b2b2"
blue    = "#b2b2b2"
magenta = "#b2b2b2"
cyan    = "#b2b2b2"
white   = "#fefefe"
bright_black   = "#818081"
bright_red     = "#b2b2b2"
bright_green   = "#b2b2b2"
bright_yellow  = "#b2b2b2"
bright_blue    = "#b2b2b2"
bright_magenta = "#b2b2b2"
bright_cyan    = "#b2b2b2"
bright_white   = "#fefefe"

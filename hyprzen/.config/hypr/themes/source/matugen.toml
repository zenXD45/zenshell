# Matugen 4.x ↔ HyprZen bridge.
#
# Emits a complete HyprZen theme source (same schema as themes/source/*.toml)
# from Matugen's Material You roles + base16 scheme. gen-themes.py consumes the
# result, so the wallpaper palette reaches Hyprland, Kitty, GTK CSS and the
# island without any of them parsing Matugen's own output format.
[meta]
name = "Matugen"
slug = "matugen"
icon = "🎨"
dark  = true
gtk_theme = "adw-gtk3-dark"

[colors]
bg      = "#1a1111"
surface = "#1a1111"
overlay = "#231919"
accent  = "#ffb3ae"
fg      = "#f1dedd"
subfg   = "#d8c2bf"
urgent  = "#ffb4ab"

[geometry]
rounding = 14
border_size = 0
gaps_in = 5
gaps_out = 14
blur_size = 5
blur_passes = 3
inactive_opacity = 0.93
shadow_color = "rgba(0000008c)"

[palette]
black   = "#050202"
red     = "#050202"
green   = "#8c1f1f"
yellow  = "#791b1a"
blue    = "#901f20"
magenta = "#901f21"
cyan    = "#9b2c2f"
white   = "#f5af67"
bright_black   = "#6c4c2e"
bright_red     = "#050202"
bright_green   = "#8c1f1f"
bright_yellow  = "#791b1a"
bright_blue    = "#901f20"
bright_magenta = "#901f21"
bright_cyan    = "#9b2c2f"
bright_white   = "#f5af67"

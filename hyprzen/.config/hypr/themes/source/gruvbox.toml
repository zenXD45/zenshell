# Gruvbox — warm, retro, chunky. Low rounding and visible borders sell the
# 1970s-terminal feel.

[meta]
name = "Gruvbox"
slug = "gruvbox"
icon = "📦"
dark  = true

[colors]
bg      = "#282828"
surface = "#3c3836"
overlay = "#1d2021"
accent  = "#d79921"
fg      = "#ebdbb2"
subfg   = "#d5c4a1"
urgent  = "#fb4934"

[geometry]
rounding = 8
border_size = 2
gaps_in = 4
gaps_out = 8
blur_size = 3
blur_passes = 2
inactive_opacity = 0.92
shadow_color = "rgba(00000073)"

[palette]
black   = "#1d2021"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"
bright_black   = "#928374"
bright_red     = "#fb4934"
bright_green   = "#b8bb26"
bright_yellow  = "#fabd2f"
bright_blue    = "#83a598"
bright_magenta = "#d3869b"
bright_cyan    = "#8ec07c"
bright_white   = "#eebeb5"

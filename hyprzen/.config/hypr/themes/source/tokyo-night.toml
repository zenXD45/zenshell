# Tokyo Night — crisp and precise. A step up in rounding from Nord.

[meta]
name = "Tokyo Night"
slug = "tokyo-night"
icon = "🌃"
dark  = true

[colors]
bg      = "#1a1b26"
surface = "#1f2335"
overlay = "#15161e"
accent  = "#7aa2f7"
fg      = "#c0caf5"
subfg   = "#a9b1d6"
urgent  = "#f7768e"

[geometry]
rounding = 12
border_size = 2
gaps_in = 5
gaps_out = 12
blur_size = 5
blur_passes = 3
inactive_opacity = 0.92
shadow_color = "rgba(00000066)"

[palette]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"
bright_black   = "#414868"
bright_red     = "#f7768e"
bright_green   = "#9ece6a"
bright_yellow  = "#e0af68"
bright_blue    = "#7aa2f7"
bright_magenta = "#bb9af7"
bright_cyan    = "#7dcfff"
bright_white   = "#c0caf5"

# Dynamic (pywal) — fallback defaults.
#
# This file exists so a fresh checkout has a valid theme before pywal has ever
# run. At runtime `hyprzen/scripts/dynamic-colors.sh` OVERWRITES themes/dynamic.lua
# with colours sampled from the current wallpaper. Treat the values below as a
# placeholder, not as the theme's real appearance.

[meta]
name = "Dynamic (pywal)"
slug = "dynamic"
icon = "🎨"
dark  = true

[colors]
bg      = "#15180a"
surface = "#15180a"
overlay = "#696d59"
accent  = "#90aa22"
fg      = "#ebdbb2"
subfg   = "#bdae93"
urgent  = "#fb4934"

[geometry]
rounding = 12
border_size = 2
gaps_in = 5
gaps_out = 12
blur_size = 4
blur_passes = 2
inactive_opacity = 0.92
shadow_color = "rgba(00000066)"

[palette]
black   = "#15180a"
red     = "#fb4934"
green   = "#90aa22"
yellow  = "#fabd2f"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#ebdbb2"
bright_black   = "#928374"
bright_red     = "#fb4934"
bright_green   = "#b8bb26"
bright_yellow  = "#fabd2f"
bright_blue    = "#83a598"
bright_magenta = "#d3869b"
bright_cyan    = "#8ec07c"
bright_white   = "#eebeb5"

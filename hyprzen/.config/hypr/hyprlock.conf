# HyprZen — Frieren Lock Screen
# Uses ~/wallpapers/current (maintained by the wallpaper selector
# and install.sh) so this works on any machine.

general {
    disable_loading_bar   = true
    grace                 = 0
    hide_cursor           = true
    no_fade_in            = false
    no_fade_out           = false
    ignore_empty_input    = true
}

# ── Background ────────────────────────────────────────────────
background {
    monitor     =
    path        = ~/wallpapers/current
    blur_passes = 3
    blur_size   = 4
    brightness  = 0.75
    contrast    = 0.9
    vibrancy    = 0.2
    vibrancy_darkness = 0.2
}

# ── Title (F R I E R E N) ─────────────────────────────────────
label {
    monitor =
    text = Z E N
    color = rgba(255, 255, 255, 0.9)
    font_size = 55
    font_family = Google Sans Flex
    shadow_passes = 3
    shadow_size = 4
    position = 120, 260
    halign = left
    valign = center
}

# ── Subtitle ──────────────────────────────────────────────────
label {
    monitor =
    text = Welcome!
    color = rgba(255, 255, 255, 0.75)
    font_size = 18
    font_family = Google Sans Flex
    shadow_passes = 2
    shadow_size = 3
    position = 120, 190
    halign = left
    valign = center
}

# ── Clock ─────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = Google Sans Flex
    shadow_passes = 3
    shadow_size = 5
    position = 110, 70
    halign = left
    valign = center
}

# ── Date ──────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:18000000] echo "<b>"$(date +'%A %-d %B' | tr 'a-z' 'A-Z')"</b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 22
    font_family = Google Sans Flex
    shadow_passes = 2
    shadow_size = 3
    position = 120, -40
    halign = left
    valign = center
}

# ── Username Indicator ────────────────────────────────────────
label {
    monitor =
    text =    $USER
    color = rgba(255, 255, 255, 0.5)
    font_size = 16
    font_family = Google Sans Flex
    shadow_passes = 1
    position = 125, -110
    halign = left
    valign = center
}

# ── Password Input ────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = false
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.15)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff80"><i>   PASSWORD</i></span>
    hide_input = false
    rounding = 8
    check_color = rgba(97, 175, 239, 0.5)
    fail_color = rgba(224, 108, 117, 0.5)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(229, 192, 123, 0.5)
    position = 120, -170
    halign = left
    valign = center
}

# ── Bottom Status Text ────────────────────────────────────────
label {
    monitor =
    text = SESSION HYPRLAND / $USER / VIRTUAL KEYBOARD OFF
    color = rgba(255, 255, 255, 0.3)
    font_size = 10
    font_family = Google Sans Flex
    position = 120, 60
    halign = left
    valign = bottom
}
